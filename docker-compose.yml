
services:

  # ============================================================
  # STEP 1: AZURITE STORAGE EMULATOR
  # ============================================================
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite

    command:
      - azurite
      - --blobHost
      - "0.0.0.0"
      - --queueHost
      - "0.0.0.0"
      - --tableHost
      - "0.0.0.0"
      - --location
      - /data
      - --skipApiVersionCheck

    #ports:
      #- "127.0.0.1:10000:10000"
      #- "127.0.0.1:10001:10001"
      #- "127.0.0.1:10002:10002"

    ports:
      - "127.0.0.1:11000:10000"
      - "127.0.0.1:11001:10001"
      - "127.0.0.1:11002:10002"

    volumes:
      - azurite-data:/data

    networks:
      - coffeenchill-network

    restart: unless-stopped


  # ============================================================
  # STEP 2: AZURE FUNCTIONS
  # ============================================================
  functions:
    image: babyade/coffeenchill-functions:v4.0

    environment:
      AzureWebJobsStorage: "${AZURITE_CONNECTION_STRING}"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"

    depends_on:
      - azurite

    networks:
      - coffeenchill-network

    restart: unless-stopped


  # ============================================================
  # STEP 3: API GATEWAY
  # ============================================================
  gateway:
    image: babyade/coffeenchill-functions:v4.1

    ports:
      - "127.0.0.1:5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"

      Functions__BaseUrl: "http://functions:80/"

      ConnectionStrings__AzureStorage: "${AZURITE_CONNECTION_STRING}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpiryMinutes: "60"

    depends_on:
      - functions

    networks:
      - coffeenchill-network

    restart: unless-stopped


# ==============================================================
# STEP 4: CUSTOM DOCKER NETWORK
# ==============================================================
networks:
  coffeenchill-network:
    driver: bridge


# ==============================================================
# STEP 5: PERSISTENT AZURITE VOLUME
# ==============================================================
volumes:
  azurite-data:
